# A stand-in for a game: the settings the toolkit reads for one (Makefile, tools and launcher, through
# tools/gamecfg.py). There is no such ROM set; a real game's file names and checksums are those of the
# set its player has.

name = Example Game
title = Example Game Recomp
id = example
app_id = io.github.tmcleroy.cps2recomp.example
disclaimer = A stand-in with no game.

# the ROM set a port is made from: its name, the set it is a version of, and what the launcher calls it
rom_set = example
rom_parent = example
rom_name = Example Game (no such set)

# the set's files, each with its CRC-32
program = ex.03:00000000 ex.04:00000000
graphics = ex.13m:00000000 ex.15m:00000000 ex.17m:00000000 ex.19m:00000000
sound_program = ex.01:00000000
samples = ex.11m:00000000 ex.12m:00000000
key = example.key:00000000

# where the program's code ends (hex)
code_end = 100000
