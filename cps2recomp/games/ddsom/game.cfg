#
# Dungeons & Dragons: Shadow over Mystara (Capcom 1996, CPS-2 arcade board):
# per-game settings read by the cps2recomp toolkit (Makefile, tools and launcher
# via tools/gamecfg.py).
#
# ROM set identified from <the rom>.zip (22 files).
# CRC32 of every file verified against MAME's src/mame/capcom/cps2.cpp (machine ddsom).

name = Dungeons & Dragons: Shadow over Mystara
# What the window is called (the name stays the folder the player's settings are kept under)
title = Dungeons & Dragons: Shadow over Mystara Recomp
id = ddsom
app_id = io.github.tmcleroy.dungeonsanddragons
disclaimer = Not affiliated with Capcom.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# ddsom is the USA release (950101) of the one revision; the other regions differ only in their words.
rom_set = ddsom
rom_parent = ddsom
rom_name = Dungeons & Dragons: Shadow over Mystara (USA 950101)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
# program: the 68000's ROMs (16-bit words, ROM_LOAD16_WORD_SWAP in MAME). graphics: four files side
# by side per row (64-bit words). sound_program: the Z80's ROM. samples: the QSound chip's.
# key: the CPS-2 master key (region "key", 20 bytes); NOT in the zip — must be supplied (see PROGRESS.md).
program = dd2e.03e:449361af dd2e.04e:5b7052b6 dd2e.05e:788d5f60 dd2e.06e:e0807e1e dd2e.07:bb777a02 dd2e.08:30970890 dd2e.09:99e2194d dd2e.10:e198805e
graphics = dd2.13m:a46b4e6e dd2.15m:d5fc50fc dd2.17m:837c0867 dd2.19m:bb0ec21c dd2.14m:6d824ce2 dd2.16m:79682ae5 dd2.18m:acddd149 dd2.20m:117fb0c0
sound_program = dd2.01:99d657e5 dd2.02:117a3824
samples = dd2.11m:98d0c325 dd2.12m:5ea2e7fa
key = ddsom.key:541e425d

# Four players, and what the game calls its three buttons (the launcher's Controllers page shows these)
players = 4
buttons = Attack | Jump | Magic

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this
# (the program region is 8 * 0x80000 = 0x400000)
code_end = 0x400000

# Features that help made-up play get far when looking for the game's code ('make explore')
explore_features = free_play

# check_release.sh: how many of the ladder's pictures the build with no translated code may show a frame early
release_allowed = 150
