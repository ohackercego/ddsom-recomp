[features]
board_players=2
free_play=1

; Dungeons & Dragons: Shadow over Mystara (ddsom) - control bindings
; Written by hand for the recomp port (games/ddsom/). The port reads this file
; once at start; the launcher's Controllers page writes the same format.
;
;   [keyboardN]   a key by SDL's name for it ("Up", "A", "Return"), or "none"
;   up = Up
;
; Player 1 - keyboard:
;   arrows            walk (up, down, left, right)
;   A                 Attack   (button 1)
;   S                 Jump     (button 2)
;   D                 Magic    (button 3)
;   F                 a 4th button (the board has four; the game uses three)
;   Left Shift        Coin (insert a coin)
;   Return            Start (player 1's start button)
[keyboard1]
up = Up
down = Down
left = Left
right = Right
lp = A
mp = S
hp = D
start = Return
coin = Left Shift

[keyboard2]
up = 6
down = 4
left = 3
right = 5
lp = Z
mp = X
hp = C
start = 2
coin = 1

[keyboard3]
up = KP_8
down = KP_2
left = KP_4
right = KP_6
lp = O
mp = P
hp = Semicolon
start = 8
coin = 7

[keyboard4]
up = T
down = G
left = F
right = H
lp = V
mp = B
hp = N
start = 0
coin = 9

