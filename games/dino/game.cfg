#
# Cadillacs and Dinosaurs (Capcom 1993, CPS-1 arcade board with QSound): per-game settings read by the cps2recomp
# toolkit (Makefile, tools and launcher via tools/gamecfg.py).

name = Cadillacs and Dinosaurs
# What the window is called (the name stays the folder the player's settings are kept under)
title = Cadillacs and Dinosaurs Recomp
id = dino
app_id = io.github.tmcleroy.cadillacsanddinosaurs
disclaimer = Not affiliated with Capcom.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# dino is the World release (930201), the parent set; the USA and Japan sets differ only in their words.
rom_set = dino
rom_parent = dino
rom_name = Cadillacs and Dinosaurs (World 930201)

# The board: a CPS-1 with QSound (machine/romset.h). Its CPS-B chip (CPS-B-21, set up as MAME's table has it, QS2):
# layer control, the four priority masks, palette control, the layer enable bits (byte offsets, hex)
board = cps1
cps_b = 0A 0C 0E 00 02 04 16 16 16

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
# program: the 68000's ROMs (16-bit words). graphics: four files side by side per row (64-bit words).
# sound_program: the Z80's ROM (its first 0x8000 bytes enciphered: machine/kabuki.h). samples: the QSound chip's.
# No key file: the board's program is not enciphered.
program = cde_23a.8f:8f4e585e cde_22a.7f:9278aa12 cde_21a.6f:66d23de2
graphics = cd-1m.3a:8da4f917 cd-3m.5a:6c40f603 cd-2m.4a:09c8fc2d cd-4m.6a:637ff38f cd-5m.7a:470befee cd-7m.9a:22bfb7a3 cd-6m.8a:e7599ac4 cd-8m.10a:211b4b15
sound_program = cd_q.5k:605fdb0b
samples = cd-q1.1k:60927775 cd-q2.2k:770f4c47 cd-q3.3k:2f273ffc cd-q4.4k:2c67821d

# Three players, and what the game calls its two buttons (the launcher's Controllers page shows these)
players = 3
buttons = Attack | Jump

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this
code_end = 180000

# Features that help made-up play get far when looking for the game's code ('make explore')
explore_features = free_play

# check_release.sh: how many of the ladder's pictures the build with no translated code may show a frame early
release_allowed = 150
