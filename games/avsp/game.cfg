#
# Alien vs. Predator (Capcom 1994, CPS-2 arcade board): per-game settings read by the cps2recomp toolkit
# (Makefile, tools and launcher via tools/gamecfg.py).

name = Alien vs. Predator
# What the window is called (the name stays the folder the player's settings are kept under)
title = Alien vs. Predator Recomp
id = avsp
app_id = io.github.tmcleroy.alienvspredator
disclaimer = Not affiliated with Capcom.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# avspu is the USA release of the one revision (940520); the other regions differ only in their words.
rom_set = avspu
rom_parent = avsp
rom_name = Alien vs. Predator (USA 940520)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
program = avpu.03d:42757950 avpu.04d:5abcdee6 avp.05d:fbfb5d7a avp.06:190b817f
graphics = avp.13m:8f8b5ae4 avp.15m:b00280df avp.17m:94403195 avp.19m:e1981245 avp.14m:39933b1e avp.16m:85412860 avp.18m:2e2beb06 avp.20m:e4798d1a
sound_program = avp.01:2d3b4220
samples = avp.11m:83499817 avp.12m:f4110d49
key = avspu.key:4e68e346

# Three players, and what the game calls its three buttons (the launcher's Controllers page shows these)
players = 3
buttons = Attack | Jump | Shoot

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this
code_end = 200000

# Features that help made-up play get far when looking for the game's code ('make explore')
explore_features = free_play

# check_release.sh: how many of the ladder's pictures the build with no translated code may show a frame early
release_allowed = 150
